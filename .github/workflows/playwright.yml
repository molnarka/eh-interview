name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
    
jobs:
  test:
    name: Run tests in Dev Container
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Start Dev Container and run Playwright tests
      uses: devcontainers/ci@v0.3
      with:
      push: never
        runCmd: |
          npm install --include=dev
          npx playwright install --with-deps
          npx playwright test

    - name: Upload allure-results to artifactory
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: |
          allure-results
        if-no-files-found: warn
        retention-days: 7

  allure-report:
    name: Generate Allure report
    runs-on: ubuntu-latest
    needs: test
    if: always() 

    steps:
      - name: Download allure-results from artifactory
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: ./allure-results

      - name: Generate Allure report
        uses: simple-elf/allure-report-action@v1.13
        with:
          allure_results: ./allure-results
          allure_report: ./allure-report

      - name: Upload Pages artifact (Allure report)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./allure-report 

  deploy-pages:
    name: Publish Allure report to GitHub Pages
    runs-on: ubuntu-latest
    needs: allure-report

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Add report URL to summary
        run: |
          {
            echo "Test report deployed!"
            echo "Report URL: ${{ steps.deploy.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
